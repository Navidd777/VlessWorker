name: Update subscription from worker

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual run button

permissions:
  contents: write            # push sub files back to this repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch fresh subscription from Cloudflare Worker
        env:
          WORKER_BASE: https://donya31.wknavid.workers.dev
          WORKER_UUID: 8c97b4e6-9a9a-52cb-8bed-52452d293107
        run: |
          set -e
          echo "Using URL: $WORKER_BASE/xray/$WORKER_UUID"
          mkdir -p docs
          # Worker returns base64(sub). Decode to plain vless:// links.
          curl -SfL --retry 3 --retry-delay 5 --max-time 60 \
            "$WORKER_BASE/xray/$WORKER_UUID" | base64 -d > docs/sub-xray.txt
          curl -SfL --retry 3 --retry-delay 5 --max-time 60 \
            "$WORKER_BASE/sb/$WORKER_UUID"   | base64 -d > docs/sub-sb.txt
          # base64 combined sub for clients that expect a wrapped classic sub
          cat docs/sub-xray.txt docs/sub-sb.txt | base64 -w0 > docs/sub-all.b64
          echo "Fetched $(wc -l < docs/sub-xray.txt) xray lines, $(wc -l < docs/sub-sb.txt) sb lines"
          echo "--- first 120 chars ---"
          head -c 120 docs/sub-xray.txt; echo

      - name: Commit sub files to docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "refresh sub $(date -u +%F_%H:%M) [skip ci]"
          git push
